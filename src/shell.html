<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
{{STYLE}}
<style>
#gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden;color:#fff;font-family:"Be Vietnam Pro",system-ui,sans-serif;background:radial-gradient(70% 60% at 85% 0%,rgba(0,200,90,.45),transparent 70%),radial-gradient(60% 60% at 0% 100%,rgba(216,30,44,.28),transparent 70%),linear-gradient(160deg,#0f6b3a 0%,#0b4f2a 50%,#06331b 100%)}
#gate::before{content:"";position:absolute;inset:0;background:var(--art) center/cover no-repeat;opacity:.9;pointer-events:none}
#gate::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-120px;height:260px;background:linear-gradient(0deg,rgba(0,0,0,.35),transparent);pointer-events:none}
#gate .card{position:relative;z-index:1}
#gate .card{width:min(420px,100%);background:rgba(8,40,22,.42);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:28px 24px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 24px 70px rgba(0,0,0,.4)}
#gate .star{width:44px;height:44px;border-radius:12px;background:#d81e2c;display:grid;place-items:center;margin-bottom:16px}
#gate .star svg{width:24px;height:24px;fill:#fff}
#gate h1{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.01em}
#gate p{margin:0 0 20px;font-size:13.5px;opacity:.8;line-height:1.5}
#gate label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;opacity:.8;margin-bottom:6px}
#gate input{width:100%;box-sizing:border-box;font:inherit;font-size:15px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.95);color:#0b4f2a;font-weight:600}
#gate input:focus{outline:3px solid rgba(255,255,255,.35);outline-offset:1px}
#gate button{margin-top:14px;width:100%;font:inherit;font-weight:800;font-size:15px;padding:12px;border:0;border-radius:12px;background:#fff;color:#0b4f2a;cursor:pointer}
#gate button:disabled{opacity:.6;cursor:wait}
#gate .err{min-height:20px;margin-top:10px;font-size:13px;font-weight:700;color:#ffb3b9}
#gate .foot{margin-top:18px;font-size:11.5px;opacity:.6}
.rolechip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);border-radius:99px;padding:5px 12px;font-weight:700}
.xbar .logout{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);padding:7px 14px}
.tabs button[hidden]{display:none!important}
</style>
</head>
<body>
<div id="gate">
  <form class="card" id="gateForm" autocomplete="off">
    <div class="star"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z"/></svg></div>
    <h1>NPP P&amp;L Simulator</h1>
    <p>HVN · HCM Zone 2 &amp; 3. Nhập tên đăng nhập và mật khẩu được cấp để mở công cụ.</p>
    <label for="gateUser">Tên đăng nhập (Admin: admin · NPP: DisID)</label>
    <input id="gateUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <div style="height:12px"></div>
    <label for="gatePw">Mật khẩu</label>
    <input id="gatePw" name="password" type="password" autocomplete="current-password" required>
    <button id="gateBtn" type="submit">Đăng nhập</button>
    <div class="err" id="gateErr" role="alert"></div>
    <div class="foot">Dữ liệu được mã hoá, chỉ giải mã trên trình duyệt sau khi đăng nhập.</div>
  </form>
</div>
<div id="app" hidden>
{{BODY}}
</div>
<script>
const SEALED={{SEALED}};
(()=>{
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=u=>btoa(String.fromCharCode(...u));
const SK="npppl:session";
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const ss={get(){try{return JSON.parse(sessionStorage.getItem(SK))}catch(e){return null}},
  set(v){try{sessionStorage.setItem(SK,JSON.stringify(v))}catch(e){}},del(){try{sessionStorage.removeItem(SK)}catch(e){}}};

async function unwrap(pw,u){
  const hx=await sha(u),cand=SEALED.keys.filter(k=>k.h===hx);
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  for(const k of cand){
    const kek=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(k.salt),iterations:SEALED.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    try{const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(k.iv)},kek,b64(k.ct));return JSON.parse(new TextDecoder().decode(raw))}catch(e){}
  }
  return null}

async function open(sess){
  const ck=await crypto.subtle.importKey("raw",b64(sess.ck),"AES-GCM",false,["decrypt"]);
  const code=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(SEALED.iv)},ck,b64(SEALED.ct)));
  window.__ROLE=sess.role;window.__AUTH=sess.auth||"";window.__USER=sess.user||"";
  document.getElementById("gate").remove();
  document.getElementById("app").hidden=false;
  const s=document.createElement("script");s.textContent=code;document.body.appendChild(s);
  const bar=document.querySelector(".xbar");
  if(bar){const chip=document.createElement("span");chip.className="rolechip";chip.textContent=sess.role==="admin"?"Admin":"NPP";
    const out=document.createElement("button");out.type="button";out.className="logout";out.textContent="Đăng xuất";
    out.onclick=()=>{ss.del();location.reload()};bar.prepend(chip);bar.appendChild(out)}
}

const f=document.getElementById("gateForm"),btn=document.getElementById("gateBtn"),err=document.getElementById("gateErr");
f.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";btn.disabled=true;btn.textContent="Đang kiểm tra…";
  try{const pw=document.getElementById("gatePw").value,u=document.getElementById("gateUser").value.trim().toLowerCase();
    const sess=await unwrap(pw,u);
    if(!sess||sess.user!==u){err.textContent="Tên đăng nhập hoặc mật khẩu không đúng.";return}
    sess.auth=await sha(pw);
    ss.set(sess);await open(sess)}
  catch(x){err.textContent="Không mở được công cụ: "+(x&&x.message||x)}
  finally{btn.disabled=false;btn.textContent="Đăng nhập"}});

const saved=ss.get();
if(saved&&saved.ck&&saved.auth)open(saved).catch(()=>ss.del());
})();
</script>
</body>
</html>
