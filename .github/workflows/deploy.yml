name: Deploy P&L Tool

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (mã hoá dữ liệu + phân quyền)
        run: node scripts/build.mjs
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          NPP_PASSWORD: ${{ secrets.NPP_PASSWORD }}
          API_URL: ${{ secrets.API_URL }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          NPP_USER: ${{ vars.NPP_USER }}
      - name: Đóng gói thư viện Excel cùng trang (không phụ thuộc CDN)
        run: curl -fsSL https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js -o dist/xlsx.bundle.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
